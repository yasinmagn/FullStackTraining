<!-- Second page of the site: the full product listing. Same header/footer structure
     as index.html so the site feels consistent as you navigate between pages. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SooqOnline — All Products</title>
</head>
<body>
  <header>
    <h1>SooqOnline</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="#">Cart (0)</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>All Products</h2>
      <!-- Each <article> is one product card. Putting the tags on one line has no effect
           on how the browser renders them — HTML ignores extra whitespace/newlines. -->
      <article class="product-card">
        <img src="images/phone.jpg" alt="Smartphone X200" />
        <h3>Smartphone X200</h3><p class="price">$120</p><button>Add to Cart</button>
      </article>
      <article class="product-card">
        <img src="images/phone-y10.jpg" alt="Smartphone Y10" />
        <h3>Smartphone Y10</h3><p class="price">$85</p><button>Add to Cart</button>
      </article>
      <article class="product-card">
        <img src="images/laptop.jpg" alt="Laptop Pro 14" />
        <h3>Laptop Pro 14</h3><p class="price">$450</p><button>Add to Cart</button>
      </article>
      <article class="product-card">
        <img src="images/laptop-air.jpg" alt="Laptop Air 13" />
        <h3>Laptop Air 13</h3><p class="price">$380</p><button>Add to Cart</button>
      </article>
      <article class="product-card">
        <img src="images/charger.jpg" alt="USB-C Charger" />
        <h3>USB-C Charger</h3><p class="price">$8</p><button>Add to Cart</button>
      </article>
      <article class="product-card">
        <img src="images/case.jpg" alt="Phone Case" />
        <h3>Phone Case</h3><p class="price">$5</p><button>Add to Cart</button>
      </article>
      <article class="product-card">
        <img src="images/headphones.jpg" alt="Headphones Air" />
        <h3>Headphones Air</h3><p class="price">$25</p><button>Add to Cart</button>
      </article>
      <article class="product-card">
        <img src="images/speaker.jpg" alt="Bluetooth Speaker" />
        <h3>Bluetooth Speaker</h3><p class="price">$35</p><button>Add to Cart</button>
      </article>
    </section>
  </main>

  <footer>
    <p>© 2026 SooqOnline · Built by Yasin Magan · Hargeisa, Somaliland</p>
  </footer>
</body>
</html>
